name: Desktop foundation checks

on:
  push:
    branches: [main]
    # Issue #905: a change that touches only documentation (docs/, which includes the per-task handoffs, and the top-level notes) reads no test, so it does not occupy the Mac runner
    # for ~20 minutes; nor does a change to the practice replays alone (replays/, issue #1262: replays.yml checks those). A change that also touches code, a workflow, a skill or AGENTS.md/CLAUDE.md still runs everything.
    paths-ignore: ['docs/**', 'replays/**', 'README.md', 'CONTRIBUTING.md', 'PRODUCT.md', 'DESIGN.md', 'AI_HANDOFF.md']
  pull_request:
    paths-ignore: ['docs/**', 'replays/**', 'README.md', 'CONTRIBUTING.md', 'PRODUCT.md', 'DESIGN.md', 'AI_HANDOFF.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route-mac:
    name: route-mac
    # Issue #1303: picks the Mac for the macos-local row. Alfredo's Studio is primary. When the Studio's last two macos-local jobs both
    # hit the 25-minute limit and the newer one ended in the last 24 hours, the row runs on Mendon's backup Mac instead; after 24 hours
    # without a new Studio timeout it tries the Studio again. Repository variable MAC_RUNNER (studio or m5) overrides the choice.
    # A timeout is a cancelled job that ran at least 24 minutes; shorter cancels (a newer push) are skipped. Any API error keeps the Studio.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # list this workflow's past runs and their jobs to find Studio timeouts
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      timeout: ${{ steps.pick.outputs.timeout }}
      depth: ${{ steps.pick.outputs.depth }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ vars.MAC_RUNNER }}
        run: |
          studio_timeouts() {
            local seen=0 timeouts=0 newest_end=""
            for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?status=completed&per_page=30" --jq '.workflow_runs[].id'); do
              job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=50" --jq \
                '[.jobs[] | select(.name == "verify (macos-local)" and .runner_name == "alfredo-mac-studio" and .started_at != null and .completed_at != null)][0] // empty | "\(.conclusion) \(.started_at) \(.completed_at)"')
              [ -n "$job" ] || continue
              read -r conclusion started completed <<< "$job"
              minutes=$(( ($(date -d "$completed" +%s) - $(date -d "$started" +%s)) / 60 ))
              echo "Studio job in run $run: $conclusion after $minutes min" >&2
              # A shorter cancel (a newer push superseded the run) says nothing about the Studio: skip it rather than count it.
              if [ "$conclusion" = cancelled ] && [ "$minutes" -lt 24 ]; then continue; fi
              seen=$((seen + 1)); [ -n "$newest_end" ] || newest_end=$completed
              [ "$conclusion" = cancelled ] && timeouts=$((timeouts + 1))
              [ "$seen" -lt 2 ] || break
            done
            [ "$timeouts" -eq 2 ] && [ $(( $(date +%s) - $(date -d "$newest_end" +%s) )) -lt 86400 ]
          }
          case "$OVERRIDE" in
            m5) pick=m5 ;;
            studio) pick=studio ;;
            *) if studio_timeouts; then pick=m5; else pick=studio; fi ;;
          esac
          if [ "$pick" = m5 ]; then
            # 60 minutes and full history: a shallow fetch re-sends the whole ~3.8 GB tree every run (~27 min on this connection), while
            # full history, once on disk, lets each later run fetch only new commits.
            echo 'runner=["self-hosted","macOS","ARM64","l5r-mac-m5"]' >> "$GITHUB_OUTPUT"
            echo 'timeout=60' >> "$GITHUB_OUTPUT"
            echo 'depth=0' >> "$GITHUB_OUTPUT"
          else
            echo 'runner=["self-hosted","macOS","ARM64","l5r-mac-studio"]' >> "$GITHUB_OUTPUT"
            echo 'timeout=25' >> "$GITHUB_OUTPUT"
            echo 'depth=1' >> "$GITHUB_OUTPUT"
          fi
          echo "macos-local runs on: $pick" | tee -a "$GITHUB_STEP_SUMMARY"
  verify:
    name: verify (${{ matrix.os }})
    needs: route-mac
    # Only this repository’s own branches (never a fork’s) may execute on the personal Mac.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        # The Windows work runs as parallel jobs (issue #798; the single rules job took ~23 min and set the PR time): tools tests and the
        # small .NET projects ("quick"), the two scratch-repo registration builds, Core in two shards, AI in two shards, and the native
        # Godot client build, import and smoke run (windows-2022-client; its Godot import of ~1500 scans restores the previous import
        # cache). Every Windows job pays its own checkout and tool bootstrap, so do not split further without measuring. Shards come
        # from the test runner's --shard I/N and are exact partitions of one build's cases.
        # The rules jobs skip what only the Godot client reads (1 GB of client art, assets/ui, the .import/.uid sidecars): about a quarter
        # fewer files and ~1.3 GB less to fetch, verified by running every part in such a checkout (issue #798). The client job needs all of it.
        # The Mac runner keeps one job with every check, and macOS coverage is deliberate. It takes one job at a time, so that job
        # runs its stages side by side inside tools/check.sh instead of as more matrix jobs (issue #805). Its checkout cleans the
        # workspace (git clean -ffdx), so every run still bootstraps the tools, builds and does the whole Godot import.
        # Issue #1303: Alfredo's Studio is the Mac runner; the route-mac job moves the row to Mendon's backup Mac (mendon-mac-m5) after two
        # Studio timeouts in a row, with its time limit and full-history checkout (see route-mac and docs/SELF_HOSTED_RUNNER.md).
        include:
          - os: macos-local
            runner: ${{ fromJSON(needs.route-mac.outputs.runner) }}
            args: ''
            timeout: ${{ fromJSON(needs.route-mac.outputs.timeout) }}
            sparse: ''
          - os: windows-2022-quick
            runner: [windows-2022]
            args: --part quick
            timeout: 15
            sparse: |
              /*
              !/docs/screenshots/
              !/docs/videos/
              !/assets/table/
              !/assets/ui/
              !/src/L5R.Client/Art/
              !*.import
              !*.uid
          - os: windows-2022-registration
            runner: [windows-2022]
            args: --part registration
            timeout: 15
            sparse: |
              /*
              !/docs/screenshots/
              !/docs/videos/
              !/assets/table/
              !/assets/ui/
              !/src/L5R.Client/Art/
              !*.import
              !*.uid
          - os: windows-2022-core-1
            runner: [windows-2022]
            args: --part core --shard 1/2
            timeout: 20
            sparse: |
              /*
              !/docs/screenshots/
              !/docs/videos/
              !/assets/table/
              !/assets/ui/
              !/src/L5R.Client/Art/
              !*.import
              !*.uid
          - os: windows-2022-core-2
            runner: [windows-2022]
            args: --part core --shard 2/2
            timeout: 20
            sparse: |
              /*
              !/docs/screenshots/
              !/docs/videos/
              !/assets/table/
              !/assets/ui/
              !/src/L5R.Client/Art/
              !*.import
              !*.uid
          - os: windows-2022-ai-1
            runner: [windows-2022]
            args: --part ai --shard 1/2
            timeout: 20
            sparse: |
              /*
              !/docs/screenshots/
              !/docs/videos/
              !/assets/table/
              !/assets/ui/
              !/src/L5R.Client/Art/
              !*.import
              !*.uid
          - os: windows-2022-ai-2
            runner: [windows-2022]
            args: --part ai --shard 2/2
            timeout: 20
            sparse: |
              /*
              !/docs/screenshots/
              !/docs/videos/
              !/assets/table/
              !/assets/ui/
              !/src/L5R.Client/Art/
              !*.import
              !*.uid
          - os: windows-2022-client
            runner: [windows-2022]
            args: --client-only
            timeout: 30
            sparse: |
              /*
              !/docs/screenshots/
              !/docs/videos/
              !/assets/table/
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      # Issue #905: a hung or crashed test run says where. The runner prints a RUN line before each case (the last one in a timed-out log is the case that hung), and a crash
      # of the .NET process writes a dump that the last step keeps.
      L5R_TEST_TRACE: '1'
      DOTNET_DbgEnableMiniDump: '1'
      DOTNET_DbgMiniDumpType: '2'
      DOTNET_DbgMiniDumpName: ${{ github.workspace }}/artifacts/dumps/crash-%p.dmp
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Windows runners start from an empty disk: skip ~2.2 GB of screenshots, videos and table source art that no check reads.
          sparse-checkout: ${{ matrix.sparse }}
          sparse-checkout-cone-mode: false
          # Full history (depth 0) only on the backup Mac; see route-mac. The output is the string '0', which is truthy here.
          fetch-depth: ${{ matrix.os == 'macos-local' && needs.route-mac.outputs.depth || 1 }}
      - name: Fetch main's tip for the diff-scoped comment-swallow lint
        # A single branch tip, not fetch-depth 0: this checkout is intentionally
        # shallow/sparse for slow, fresh-disk Windows runners, and full history
        # for all branches would undo that. tools/lint_comment_swallow.py only
        # needs origin/main to exist locally to compute its diff. The checkout
        # above uses persist-credentials: false (the repo is public), so
        # this one fetch authenticates itself with the ephemeral job token
        # instead of turning credential persistence back on repo-wide.
        env:
          GH_TOKEN: ${{ github.token }}
        # A full-history checkout (the backup Mac) fetches main whole, so a later fetch stays incremental.
        run: |
          depth=--depth=1; [ "$(git rev-parse --is-shallow-repository)" = true ] || depth=
          git fetch --no-tags $depth "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Prepare local Python environment
        if: runner.os == 'macOS'
        run: |
          python3 -c "import sys; assert sys.version_info >= (3, 12), 'Python 3.12+ required'"
          python3 -m venv "$RUNNER_TEMP/l5r-python"
          echo "$RUNNER_TEMP/l5r-python/bin" >> "$GITHUB_PATH"
      - name: Install content image validation dependency
        run: python -m pip install -r tools/content/requirements.txt
      - name: Install pinned project tools
        run: python tools/bootstrap.py --install
      # Godot only reimports what changed when it finds the previous import: restore the newest cache for this Godot pin, save a new one after a passing run.
      - name: Restore Godot import cache
        if: matrix.args == '--client-only'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/L5R.Client/.godot
          key: godot-import-${{ runner.os }}-${{ hashFiles('tools/bootstrap.py', 'src/L5R.Client/project.godot') }}-${{ github.sha }}
          restore-keys: |
            godot-import-${{ runner.os }}-${{ hashFiles('tools/bootstrap.py', 'src/L5R.Client/project.godot') }}-
      - name: ${{ matrix.args == '--client-only' && 'Native client build, Godot import and smoke run' || (matrix.args == '' && 'Every check, including the native client (Mac)' || format('Checks {0}', matrix.args)) }}
        env:
          CHECK_ARGS: ${{ matrix.args }}
        run: bash tools/check.sh $CHECK_ARGS  # unquoted on purpose: a matrix value like '--part core --shard 1/2' is several arguments
      - name: Keep the Godot logs of a failed run
        if: failure() && (matrix.args == '' || matrix.args == '--client-only')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: godot-logs-${{ matrix.os }}
          path: artifacts/checks/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep crash dumps
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-dumps-${{ matrix.os }}
          path: artifacts/dumps/*.dmp
          if-no-files-found: ignore
          retention-days: 3

  # Issue #905: a broken main is told to the maintainers' chat as well as to whoever watches the checks. Posts only when a CI_FAILURE_WEBHOOK secret (a Discord or Slack
  # incoming webhook) exists; without one it does nothing.
  notify-main-failure:
    name: Tell the maintainers main is red
    needs: verify
    if: always() && needs.verify.result == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Post to the webhook, if one is configured
        env:
          WEBHOOK: ${{ secrets.CI_FAILURE_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No CI_FAILURE_WEBHOOK secret is set; nothing to post."; exit 0; fi
          MESSAGE="Main is red: desktop checks failed at ${COMMIT:0:8} (pushed by $ACTOR). $RUN_URL"
          BODY=$(MESSAGE="$MESSAGE" python3 -c 'import json, os; m = os.environ["MESSAGE"]; print(json.dumps({"content": m, "text": m}))')
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$BODY" "$WEBHOOK"
